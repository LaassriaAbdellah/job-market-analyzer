services:

  postgres:
    image: postgres:17
    container_name: job_market_postgres

    environment:
      POSTGRES_DB: job_market
      POSTGRES_USER: job_user
      POSTGRES_PASSWORD: job_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data: